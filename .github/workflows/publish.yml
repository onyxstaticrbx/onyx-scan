# Publish onyx-scan to PyPI with Trusted Publishing (no API token, no secrets).
# One-time setup, done by the operator:
#   PyPI -> Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name: onyx-scan
#     Owner:            <github owner>
#     Repository:       <repo name>
#     Workflow name:    publish.yml
#     Environment:      pypi
#   GitHub -> repo Settings -> Environments -> create `pypi` (no secrets needed)
# This workflow is manual-only by design: a published GitHub Release does not publish to PyPI.
# Publish from Actions -> publish -> Run workflow on `main`.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the wheel and sdist against the published allowlist
        # One allowlist, in tools/check_artifacts.py, run here and in test-linux/test-windows.
        # A module added to the package but not to the allowlist fails on the pull request,
        # not here, after the release button has been pressed.
        run: python tools/check_artifacts.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
