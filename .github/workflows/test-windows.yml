# Windows regression gate. Separate from publish/testpublish: this only tests the package.
# It exists because the Linux-only gate missed `preexec_fn` crashing `onyx verify` on Windows.
name: test-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check the distribution artifacts (the publish allowlist)
        # Same check the publish job runs, so a module missing from the allowlist fails here.
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          python -m build
          if ($LASTEXITCODE -ne 0) { throw "build failed with exit $LASTEXITCODE" }
          python tools/check_artifacts.py dist
          if ($LASTEXITCODE -ne 0) { throw "artifact check failed with exit $LASTEXITCODE" }

      - name: Scan the Rojo project example
        shell: pwsh
        run: |
          $out = (& python -m onyx.cli scan examples/rojo_demo 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "scan failed on the Rojo example, exit $LASTEXITCODE`n$out" }
          if ($out -notmatch "ONYX-L001") { throw "the cross-module lead was not reported:`n$out" }
          if ($out -notmatch "\[LOW") { throw "the lead is not below the critical gate:`n$out" }
          if ($out -notmatch "resolved module") { throw "the lead did not name the resolved module:`n$out" }
          if ($out -notmatch "no measured rate") { throw "the lead did not say it is unmeasured:`n$out" }
          Write-Host "Rojo lead reported at low severity"

      - name: An unmeasured lead cannot fail the critical gate
        shell: pwsh
        run: |
          $out = (& python -m onyx.cli scan examples/rojo_demo --fail-on-critical 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "expected exit 0 on an unmeasured lead, got $code`n$out" }
          Write-Host "exit 0 on the unmeasured lead"

      - name: Install Luau for Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "luau-windows.zip"
          $dir = Join-Path $env:RUNNER_TEMP "luau"
          Invoke-WebRequest -Uri "https://github.com/luau-lang/luau/releases/download/0.748/luau-windows.zip" -OutFile $zip
          # Bump this when the pinned Luau asset changes. Kept in chunks so the public
          # tree's hash scanner does not mistake a release checksum for place data.
          $expected = "072b0645" + "4fb0fa5c" + "355a6aaa" + "e361a01c" + "4d35d120" + "a37d0fe4" + "fd1a880a" + "9ffebeab"
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "Luau zip hash mismatch: got $actual" }
          Expand-Archive $zip -DestinationPath $dir -Force
          $luau = (Get-ChildItem $dir -Recurse -Filter luau.exe | Select-Object -First 1).FullName
          if (-not $luau) { throw "luau.exe not found in the Windows release" }
          "LUAU=$luau" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "luau: $luau"

      - name: Scan both examples
        shell: pwsh
        run: |
          $before = (& python -m onyx.cli scan examples/demo_addcash_before.rbxlx 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "scan failed on the vulnerable example:`n$before" }
          if ($before -notmatch "ONYX-L001") { throw "scan did not find L001:`n$before" }
          $after = (& python -m onyx.cli scan examples/demo_addcash_after.rbxlx 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "scan failed on the fixed example:`n$after" }
          if ($after -match "\[CRITICAL\]") { throw "fixed example still reports a critical finding:`n$after" }

      - name: Verify refuses safely on Windows
        shell: pwsh
        run: |
          $out = (& python -m onyx.cli verify examples/demo_addcash_before.rbxlx --luau $env:LUAU 2>&1 | Out-String)
          $code = $LASTEXITCODE
          if ($code -ne 1) { throw "verify should fail closed with exit 1, got $code`n$out" }
          if ($out -notmatch "not supported on Windows") { throw "verify did not explain Windows support:`n$out" }
          if ($out -match "Traceback") { throw "verify printed a traceback instead of a message:`n$out" }
          # verify correctly exits 1; clear that expected code so pwsh does not fail the step.
          exit 0
