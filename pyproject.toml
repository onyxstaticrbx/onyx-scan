[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-scan"
version = "0.2.2"
description = "Static exploit scan and an executing emulator for Roblox/Luau places, with measured precision per rule"
readme = "README-PYPI.md"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["roblox", "luau", "static-analysis", "security", "scanner"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Other",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
onyx = "onyx.cli:main"

[project.urls]
Source = "https://github.com/onyxstaticrbx/onyx-scan"
Issues = "https://github.com/onyxstaticrbx/onyx-scan/issues"

[tool.setuptools]
packages = ["onyx", "onyx.luau"]

[tool.setuptools.package-data]
onyx = ["luau/*.luau"]
